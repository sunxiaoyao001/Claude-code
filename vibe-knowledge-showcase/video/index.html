<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Vibe Coding 黑话大赏</title>
<link rel="stylesheet" href="node_modules/@fontsource-variable/noto-sans-sc/wght.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/700.css">
<style>
  :root {
    --bg: #0E0F13;
    --panel: #171922;
    --line: #2A2D3A;
    --green: #7CFFB2;
    --orange: #FF7A59;
    --red: #FF4D5E;
    --text: #F2F2F2;
    --dim: #8A8F9E;
    --sans: 'Noto Sans SC Variable', 'WenQuanYi Zen Hei', sans-serif;
    --mono: 'JetBrains Mono', 'WenQuanYi Zen Hei Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; overflow: hidden; }
  #stage {
    position: relative; width: 1080px; height: 1920px; overflow: hidden;
    background:
      radial-gradient(ellipse 90% 60% at 50% 45%, rgba(124,255,178,.07), transparent 70%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 60px 60px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 60px 60px,
      var(--bg);
    font-family: var(--sans); color: var(--text);
    transform-origin: 0 0;
  }
  #grain { position: absolute; inset: 0; opacity: .07; pointer-events: none; z-index: 50; mix-blend-mode: screen; }
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 49;
    background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 55%, rgba(0,0,0,.55)); }
  #flash { position: absolute; inset: 0; pointer-events: none; z-index: 48; opacity: 0; }
  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; display: none; }
  .mono { font-family: var(--mono); }
  .emo { font-family: 'Noto Color Emoji'; font-weight: 400; }
  .caret { display: inline-block; width: .55em; height: 1em; background: var(--green); vertical-align: -.12em; margin-left: .06em; }

  /* chrome */
  #chrome { position: absolute; left: 0; top: 0; width: 1080px; height: 220px; z-index: 30; }
  #pill { position: absolute; left: 60px; top: 118px; height: 64px; padding: 0 26px; border-radius: 32px;
    background: var(--green); color: #0E0F13; font: 700 36px/64px var(--mono); }
  #segs { position: absolute; left: 260px; right: 60px; top: 142px; height: 16px; display: flex; gap: 8px; }
  .seg { flex: 1; border-radius: 8px; background: #262935; overflow: hidden; }
  .seg i { display: block; height: 100%; width: 0; background: var(--green); }

  /* card */
  .en { left: 60px; top: 238px; font: 700 54px/1 var(--mono); color: var(--green); white-space: nowrap; }
  .zh { left: 56px; top: 312px; font-size: 132px; font-weight: 900; line-height: 1.1; letter-spacing: 2px; white-space: nowrap; transform-origin: 0 50%; }
  .vis { left: 60px; top: 560px; width: 960px; height: 600px; }
  .plain { left: 60px; right: 60px; top: 1200px; text-align: center; font-size: 58px; font-weight: 800; white-space: nowrap; }
  .plain b { display: inline-block; font: 700 34px/1 var(--sans); background: var(--green); color: #0E0F13; padding: 10px 14px; border-radius: 10px; vertical-align: 10px; margin-right: 18px; }
  .plain .mark { position: absolute; left: 0; bottom: -10px; height: 12px; background: var(--green); opacity: .35; border-radius: 6px; }
  .roast { left: 50%; top: 1320px; font-size: 46px; font-weight: 900; color: #15161B; background: var(--orange);
    padding: 14px 30px; border-radius: 14px; white-space: nowrap; box-shadow: 0 10px 0 rgba(0,0,0,.35); }

  #sub { position: absolute; left: 0; right: 0; top: 1480px; text-align: center; z-index: 40; }
  #sub span { display: inline-block; font-size: 48px; font-weight: 700; padding: 12px 28px; border-radius: 14px;
    background: rgba(0,0,0,.62); color: #fff; letter-spacing: 1px; }

  /* generic ui */
  .win { background: var(--panel); border: 2px solid var(--line); border-radius: 24px; overflow: hidden; }
  .win .bar { height: 52px; border-bottom: 2px solid var(--line); display: flex; align-items: center; gap: 12px; padding-left: 22px; }
  .win .bar i { width: 18px; height: 18px; border-radius: 50%; background: #3A3E4D; display: block; }
  .bubble { padding: 20px 28px; border-radius: 26px; font-size: 40px; font-weight: 700; white-space: nowrap; }
  .chip { padding: 10px 22px; border-radius: 40px; font-size: 36px; font-weight: 800; white-space: nowrap; }
  .stamp { font-weight: 900; border: 8px solid; border-radius: 18px; padding: 4px 22px; font-size: 64px; }
  .code { font: 400 26px/40px var(--mono); white-space: pre; }
  .k { color: #C792EA; } .f { color: #82AAFF; } .s { color: #C3E88D; } .c { color: #5C6370; } .n { color: #F78C6C; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="grain" width="270" height="480"></canvas>
  <div id="vignette"></div>
  <div id="flash"></div>
  <div id="chrome"><div id="pill">#01 / 10</div><div id="segs"></div></div>
  <div id="sub"><span></span></div>
</div>
<script>
// ---------- timing ----------
const W = 1080, H = 1920, FPS = 30, DUR = 80;
const CARD0 = 8.4, CARD_LEN = 6;

// ---------- helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const rnd = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const emo = s => s.replace(/(\p{Extended_Pictographic}️?)/gu, '<span class="emo">$1</span>');

function mk(parent, css = '', html = '', cls = 'abs') {
  const e = document.createElement('div');
  e.className = cls;
  if (css) e.style.cssText = css;
  if (html) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
// transform/opacity setter
function T(e, { x = 0, y = 0, s = 1, sx, sy, r = 0, o = 1 } = {}) {
  const scale = sx !== undefined || sy !== undefined ? `scale(${sx ?? s},${sy ?? s})` : `scale(${s})`;
  e.style.transform = `translate(${x}px,${y}px) ${scale} rotate(${r}deg)`;
  e.style.opacity = o;
}
// spring pop-in: returns {s,o}
const pop = (t, t0, d = .45) => { const k = P(t, t0, t0 + d); return { s: k <= 0 ? .001 : back(k), o: clamp(k * 3) }; };
// typewriter into element; returns progress
function typeInto(e, str, t, t0, cps, caret = true, html = false) {
  const n = Math.floor(clamp((t - t0) * cps, 0, str.length));
  const blink = n >= str.length ? Math.floor(t * 2.5) % 2 === 0 : true;
  const sub = str.slice(0, n);
  e.innerHTML = (html ? emo(esc(sub)) : esc(sub)) + (caret && t >= t0 - .3 && blink ? '<span class="caret"></span>' : '');
  return n / str.length;
}
function glitch(e, t, amt, seed = 1) {
  if (amt <= 0) { e.style.filter = ''; e.style.textShadow = ''; return { x: 0, y: 0 }; }
  const f = Math.floor(t * FPS);
  const dx = (rnd(f * 3.1 + seed) - .5) * 40 * amt, dy = (rnd(f * 7.7 + seed) - .5) * 14 * amt;
  e.style.textShadow = `${6 * amt}px 0 rgba(255,0,80,.8), ${-6 * amt}px 0 rgba(0,220,255,.8)`;
  return { x: dx, y: dy };
}

// ---------- registry ----------
const stage = document.getElementById('stage');
const scenes = [];
const SUBS = [];
const CUES = [];
let curTime = 0;
function scene(start, end, build) {
  const root = mk(stage, '', '', 'scene');
  const cue = (lt, type, dur = 0) => CUES.push({ t: +(start + lt).toFixed(3), type, dur });
  const sub = (a, b, text) => SUBS.push({ s: start + a, e: start + b, text });
  const update = build(root, cue, sub, end - start);
  scenes.push({ start, end, root, update });
  cue(0, 'whoosh');
}

// ---------- card template ----------
const TERMS = [];
function card(i, d) {
  const start = CARD0 + i * CARD_LEN, end = start + CARD_LEN;
  TERMS.push(d.short);
  scene(start, end, (root, cue, sub, dur) => {
    const wrap = mk(root, 'inset:0');
    const en = mk(wrap, '', '', 'abs en');
    const zh = mk(wrap, '', esc(d.zh), 'abs zh');
    const vis = mk(wrap, '', '', 'abs vis');
    const plain = mk(wrap, '', `<span style="position:relative;display:inline-block"><b>人话</b>${esc(d.plain)}<i class="mark"></i></span>`, 'abs plain');
    const mark = plain.querySelector('.mark');
    const roast = mk(wrap, '', emo(esc(d.roast)), 'abs roast');
    const visUpdate = d.vis(vis, cue);
    const enText = `> ${d.en}`;
    const roastT = d.roastT ?? 3.6;
    cue(.15, 'type', enText.length / 24);
    cue(.3, 'pop');
    cue(1.2, 'tick');
    cue(roastT, 'stamp');
    sub(.5, 2.9, d.subs[0]);
    sub(2.9, 5.75, d.subs[1]);
    return lt => {
      // enter / exit
      const ein = eo(P(lt, 0, .35)), eout = eio(P(lt, dur - .28, dur));
      T(wrap, { x: (1 - ein) * 420 - eout * 520, o: ein * (1 - eout) });
      typeInto(en, enText, lt, .15, 24, lt < 1.6);
      const z = pop(lt, .3, .5);
      T(zh, { s: z.s, o: z.o });
      const pk = P(lt, 1.2, 1.55);
      T(plain, { y: (1 - eo(pk)) * 30, o: eo(pk) });
      mark.style.width = (eio(P(lt, 1.45, 2.0)) * 100) + '%';
      const rk = P(lt, roastT, roastT + .35);
      const rs = rk <= 0 ? 1.8 : lerp(1.8, 1, eo(rk));
      roast.style.transform = `translate(-50%,0) scale(${rs}) rotate(${-3 - (1 - rk) * 8}deg)`;
      roast.style.opacity = clamp(rk * 4);
      visUpdate(lt);
    };
  });
}

// =====================================================================
// S01 · Hook (0 – 4.8)
// =====================================================================
scene(0, 4.8, (root, cue, sub, dur) => {
  const head = mk(root, 'left:0;right:0;top:300px;text-align:center;font-size:96px;font-weight:900;white-space:nowrap',
    '你说人话，<span style="color:var(--green)">AI 写代码</span>');
  const win = mk(root, 'left:90px;top:560px;width:900px;height:760px', '<div class="bar"><i></i><i></i><i></i></div>', 'abs win');
  const line = mk(win, 'left:40px;top:96px;font:700 54px/1 var(--mono);color:var(--text)');
  // web page mock that "grows"
  const page = mk(win, 'left:40px;top:200px;width:820px;height:520px');
  const nav = mk(page, 'left:0;top:0;width:820px;height:60px;border-radius:14px;background:#22252F');
  const logo = mk(nav, 'left:20px;top:16px;width:120px;height:28px;border-radius:8px;background:var(--green)');
  const hero = mk(page, 'left:0;top:84px;width:820px;height:220px;border-radius:20px;background:linear-gradient(120deg,#7CFFB2,#4AC7FF 60%,#B98CFF)');
  const heroT = mk(hero, 'left:44px;top:56px;font-size:64px;font-weight:900;color:#0E0F13', '我的小店');
  const heroB = mk(hero, 'left:44px;top:148px;width:200px;height:44px;border-radius:22px;background:#0E0F13');
  const cards = [0, 1, 2].map(k => mk(page, `left:${k * 280}px;top:330px;width:260px;height:190px;border-radius:18px;background:#22252F;border:2px solid #333746`));
  cards.forEach((c, k) => mk(c, `left:20px;top:20px;width:${120 + k * 30}px;height:22px;border-radius:11px;background:${['#FF7A59', '#7CFFB2', '#4AC7FF'][k]}`));
  sub(.3, 2.4, '现在写程序');
  sub(2.4, 4.6, '已经不用会写程序了');
  cue(.3, 'type', 1.0);
  cue(1.55, 'ding');
  cue(1.7, 'pop'); cue(2.0, 'pop'); cue(2.3, 'pop');
  cue(2.8, 'whoosh');
  return lt => {
    T(win, { y: (1 - eo(P(lt, 0, .5))) * 80, o: eo(P(lt, 0, .4)) * (1 - P(lt, 4.45, 4.8)), s: 1 + P(lt, 4.3, 4.8) * .15 });
    typeInto(line, '> 帮我做个网站', lt, .3, 7, lt < 1.6);
    const items = [nav, hero, ...cards];
    items.forEach((e, k) => { const p = pop(lt, 1.7 + k * .15, .45); T(e, { s: p.s, o: p.o }); });
    T(heroT, { x: (1 - eo(P(lt, 2.0, 2.4))) * -40, o: P(lt, 2.0, 2.3) });
    const h = pop(lt, 2.8, .5);
    T(head, { s: h.s, o: h.o * (1 - P(lt, 4.45, 4.8)) });
  };
});

// =====================================================================
// S02 · Title (4.8 – 8.4)
// =====================================================================
scene(4.8, 8.4, (root, cue, sub, dur) => {
  const en = mk(root, 'left:0;right:0;top:520px;text-align:center;font:700 96px/1 var(--mono);color:var(--green)');
  const zh = mk(root, 'left:0;right:0;top:640px;text-align:center;font-size:210px;font-weight:900;line-height:1.1;white-space:nowrap', '黑话大赏');
  const tag = mk(root, 'left:0;right:0;top:960px;text-align:center;font-size:52px;font-weight:700;color:var(--dim)',
    '听懂这 <span style="color:var(--orange);font-weight:900">10</span> 个词，你就入门了');
  const boxes = [...Array(10)].map((_, k) => mk(root,
    `left:${90 + (k % 5) * 186}px;top:${1100 + Math.floor(k / 5) * 130}px;width:156px;height:104px;border-radius:18px;border:3px solid var(--green);font:700 44px/98px var(--mono);text-align:center;color:var(--green)`,
    String(k + 1).padStart(2, '0')));
  sub(.2, 1.8, '跟 AI 打交道，有一套黑话');
  sub(1.8, 3.5, '10 个词，一分钟听懂');
  cue(.1, 'type', .5);
  cue(.6, 'boom');
  boxes.forEach((_, k) => cue(1.2 + k * .1, 'pop'));
  return lt => {
    const out = 1 - P(lt, 3.3, 3.6);
    typeInto(en, 'Vibe Coding', lt, .1, 22, false);
    T(en, { o: out });
    const z = pop(lt, .6, .5);
    const g = glitch(zh, lt, lt > .6 && lt < 1.0 ? 1 - P(lt, .6, 1.0) : 0, 3);
    T(zh, { x: g.x, y: g.y, s: z.s * (1 + (1 - out) * .2), o: z.o * out });
    T(tag, { y: (1 - eo(P(lt, 2.2, 2.6))) * 30, o: P(lt, 2.2, 2.5) * out });
    boxes.forEach((b, k) => { const p = pop(lt, 1.2 + k * .1, .4); T(b, { s: p.s, o: p.o * out }); });
  };
});

// =====================================================================
// Cards
// =====================================================================

// #01 Vibe Coding
card(0, {
  en: 'Vibe Coding', zh: '氛围编程', short: 'Vibe Coding',
  plain: '动嘴不动手，代码交给 AI', roast: '看不懂？能跑就行',
  subs: ['2025 年由 Karpathy 提出', '只管说想要什么，连代码都不用看'],
  vis: (v, cue) => {
    // sofa + person
    const sofa = mk(v, 'left:0;top:330px;width:420px;height:150px;border-radius:40px 40px 24px 24px;background:#2A2D3A');
    mk(v, 'left:-10px;top:290px;width:70px;height:190px;border-radius:30px;background:#353949');
    mk(v, 'left:360px;top:290px;width:70px;height:190px;border-radius:30px;background:#353949');
    const person = mk(v, 'left:60px;top:250px;width:320px;height:100px');
    mk(person, 'left:0;top:0;width:96px;height:96px;border-radius:50%;background:#F2D3B3');
    mk(person, 'left:84px;top:26px;width:236px;height:70px;border-radius:35px;background:var(--orange)');
    mk(person, 'left:20px;top:30px;width:16px;height:6px;border-radius:3px;background:#333');
    mk(person, 'left:52px;top:30px;width:16px;height:6px;border-radius:3px;background:#333');
    const bubble = mk(v, 'left:20px;top:80px;background:#fff;color:#111', '', 'abs bubble');
    const zzz = mk(v, 'left:150px;top:220px;font:700 34px var(--mono);color:var(--dim)', 'z z z');
    // monitor with scrolling code
    const mon = mk(v, 'left:470px;top:60px;width:490px;height:420px', '<div class="bar"><i></i><i></i><i></i></div>', 'abs win');
    const code = mk(mon, 'left:24px;top:70px', '', 'abs code');
    const L = ['<span class="k">const</span> app = <span class="f">createApp</span>()', '<span class="c">// 记账 App</span>',
      '<span class="k">function</span> <span class="f">addBill</span>(amt) {', '  bills.<span class="f">push</span>({ amt, <span class="s">\'today\'</span> })',
      '  <span class="f">render</span>(bills)', '}', '<span class="k">const</span> total = bills', '  .<span class="f">reduce</span>((a, b) => a + b.amt, <span class="n">0</span>)',
      '<span class="f">chart</span>.<span class="f">draw</span>(total)', '<span class="k">export default</span> app'];
    code.innerHTML = [...Array(4)].flatMap(() => L).join('\n');
    const mon2 = mon.querySelector('.bar');
    const badge = mk(v, 'left:640px;top:-10px;background:var(--orange);color:#111;transform-origin:50% 50%', 'Collins 2025 年度词', 'abs chip');
    cue(.8, 'type', 1.0); cue(2.8, 'pop');
    return lt => {
      const bp = pop(lt, .6, .4);
      T(bubble, { s: bp.s, o: bp.o });
      typeInto(bubble, '帮我做个记账 App～', lt, .8, 10, false);
      T(person, { y: Math.sin(lt * 2.4) * 4 });
      T(zzz, { y: -((lt * 40) % 40), o: .4 + .4 * Math.sin(lt * 3) });
      const mp = pop(lt, .4, .45);
      T(mon, { s: mp.s, o: mp.o });
      T(code, { y: -Math.max(0, lt - .9) * 110 });
      const b = pop(lt, 2.8, .4);
      T(badge, { s: b.s, o: b.o, r: 6 });
      void sofa; void mon2;
    };
  },
});

// #02 Prompt
card(1, {
  en: 'Prompt', zh: '提示词', short: 'Prompt',
  plain: '你给 AI 下的需求单', roast: '说不清，它就瞎猜',
  subs: ['同一个需求，两种说法', '说得越具体，AI 越靠谱'],
  vis: (v, cue) => {
    const mkSide = (x, prompt, good) => {
      const col = mk(v, `left:${x}px;top:0;width:460px;height:600px`);
      const pr = mk(col, `left:0;top:0;width:460px;min-height:120px;padding:18px 22px;border-radius:20px;background:#1E2130;border:2px solid ${good ? 'var(--green)' : '#444'};font-size:34px;font-weight:700;line-height:1.35;white-space:normal`);
      const res = mk(col, 'left:0;top:160px;width:460px;height:380px', '', 'abs win');
      const parts = [];
      if (good) {
        res.style.background = '#101219';
        parts.push(mk(res, 'left:30px;top:30px;width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#7CFFB2,#4AC7FF)'));
        parts.push(mk(res, 'left:140px;top:44px;width:200px;height:26px;border-radius:13px;background:#F2F2F2'));
        parts.push(mk(res, 'left:140px;top:84px;width:140px;height:20px;border-radius:10px;background:#555A6B'));
        [0, 1, 2].forEach(k => parts.push(mk(res, `left:${30 + k * 138}px;top:160px;width:124px;height:180px;border-radius:16px;background:#1C1F2B;border:2px solid ${['#7CFFB2', '#4AC7FF', '#B98CFF'][k]}`)));
      } else {
        res.style.background = '#C9C9C9';
        [[30, 30, 300, 40], [60, 100, 150, 120], [240, 120, 180, 60], [40, 250, 380, 40], [300, 220, 90, 140]].forEach(([l, t, w, h]) =>
          parts.push(mk(res, `left:${l}px;top:${t}px;width:${w}px;height:${h}px;background:#9A9A9A;border-radius:4px`)));
        parts.push(mk(res, 'left:170px;top:120px;font-size:120px;font-weight:900;color:#777', '?'));
      }
      const st = mk(col, `left:${good ? 270 : 280}px;top:420px;color:${good ? 'var(--green)' : 'var(--red)'};background:rgba(14,15,19,.85)`, good ? '✓' : '✗', 'abs stamp');
      return { col, pr, res, parts, st, prompt };
    };
    const A = mkSide(0, '做个好看的页面', false);
    const B = mkSide(500, '深色、极简、带动画的个人主页，三张作品卡片', true);
    cue(.6, 'type', 1.0); cue(2.3, 'error'); cue(2.4, 'type', 1.1); cue(4.4, 'success');
    const run = (S, lt, t0, tRes, tSt) => {
      const cp = pop(lt, t0 - .2, .35);
      T(S.col, { o: cp.o, y: (1 - cp.s) * 20 });
      typeInto(S.pr, S.prompt, lt, t0, S === A ? 9 : 18, false);
      const rp = P(lt, tRes, tRes + .3);
      S.res.style.opacity = rp;
      S.parts.forEach((p, k) => { const q = pop(lt, tRes + k * .07, .35); T(p, { s: q.s, o: q.o }); });
      const sp = P(lt, tSt, tSt + .25);

    cue(3.6, 'boom'); cue(3.6, 'glitch'); cue(3.65, 'error');
    const flash = document.getElementById('flash');
    return lt => {
      const sp = pop(lt, .2, .4);
      const failed = lt >= 3.6;
      const off = 40 * lt + 260 * Math.pow(Math.max(0, Math.min(lt, 3.6) - .8), 2);
      T(dl, { y: -(off % 1800) });
      T(diff, { s: sp.s, o: sp.o * (failed ? .25 : 1) });
      let n = 0, press = 0;
      clicks.forEach(t => { if (lt >= t) n++; const d = lt - t; if (d >= 0 && d < .18) press = 1 - d / .18; });
      const bp = pop(lt, .4, .4);
      btn.style.background = failed ? 'var(--red)' : 'var(--green)';
      const g = glitch(btn, lt, failed && lt < 4.2 ? 1 - P(lt, 3.6, 4.2) : 0, 2);
      T(btn, { x: g.x, y: g.y, s: bp.s * (1 - press * .08), o: bp.o });
      T(hand, { x: -press * 10, y: -press * -24 + (failed ? 300 * P(lt, 3.6, 4.0) : 0), o: bp.o * (1 - P(lt, 3.6, 3.9)) });
      counter.textContent = `已接受 ${n * 37} 处改动`;
      counter.style.opacity = lt > .8 ? (failed ? .3 : 1) : 0;
      const fk = P(lt, 3.6, 3.85);
      const gf = glitch(fail, lt, failed && lt < 4.3 ? 1 - P(lt, 3.6, 4.3) : 0, 4);
      T(fail, { x: gf.x, y: gf.y, s: lerp(1.6, 1, eo(fk)), o: fk });
      T(fail2, { o: P(lt, 3.9, 4.1) });
      // global red flash
      const fl = failed ? Math.max(0, 1 - P(lt, 3.6, 4.2)) * .5 + .12 * (1 - P(lt, 4.2, 6)) : 0;
      flash.style.background = 'var(--red)';
      flash.style.opacity = fl;
    };
  },
});

// #10 Rollback
card(9, {
  en: 'Rollback', zh: '回滚', short: '回滚',
  plain: '一键回到上一个能用的版本', roast: 'Vibe Coding 的后悔药',
  subs: ['所以最重要的是：勤存档、能撤回', '才敢放心让 AI 去折腾'],
  vis: (v, cue) => {
    const term = mk(v, 'left:80px;top:0;width:800px;height:150px', '<div class="bar"><i></i><i></i><i></i></div>', 'abs win');
    const cmd = mk(term, 'left:30px;top:76px;font:700 42px var(--mono);color:var(--green)');
    const base = mk(v, 'left:80px;top:328px;width:800px;height:8px;border-radius:4px;background:#3A3E4D');
    const dots = [0, 1, 2, 3, 4].map(k => mk(v, `left:${80 + k * 200 - 30}px;top:302px;width:60px;height:60px;border-radius:50%;background:#2A2D3A;border:6px solid ${k === 4 ? 'var(--red)' : '#6B7080'}`));
    const labs = [0, 1, 2, 3, 4].map(k => mk(v, `left:${80 + k * 200 - 60}px;top:384px;width:120px;text-align:center;font:700 36px var(--mono);color:var(--dim)`, `v${k + 1}`));
    const boomL = mk(v, 'left:810px;top:210px;font-size:64px', '<span class="emo">💥</span>');
    const okL = mk(v, 'left:612px;top:196px;color:#111;background:var(--green);font-size:32px', '✓ 能跑', 'abs chip');
    const head = mk(v, 'left:0;top:250px;width:8px;height:170px;margin-left:-4px;background:#fff;border-radius:4px');
    const tri = mk(head, 'left:-18px;top:-26px;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:28px solid #fff');
    const rew = mk(v, 'left:0;right:0;top:470px;text-align:center;font:900 54px var(--mono);color:#fff', '◀◀ REWIND');
    const ok = mk(v, 'left:0;right:0;top:470px;text-align:center;font-size:48px;font-weight:900;color:var(--green)', '✓ 已回到上一个能跑的版本');
    const flash = document.getElementById('flash');
    cue(.3, 'type', .8); cue(1.3, 'rewind'); cue(2.4, 'success');
    return lt => {
      const tp = pop(lt, .1, .4);
      T(term, { s: tp.s, o: tp.o });
      typeInto(cmd, '$ git revert HEAD', lt, .3, 22, lt < 1.3);
      const rw = eio(P(lt, 1.3, 2.4));
      const hx = 80 + lerp(800, 600, rw);
      const jit = lt > 1.3 && lt < 2.4 ? (rnd(Math.floor(lt * FPS)) - .5) * 10 : 0;
      T(head, { x: hx + jit, o: P(lt, .4, .7) * (1 - P(lt, 2.4, 2.6)) });
      base.style.opacity = P(lt, .3, .6);
      dots.forEach((d, k) => {
        const p = pop(lt, .4 + k * .07, .3);
        T(d, { s: p.s * (k === 3 && lt > 2.4 ? 1 + .3 * (1 - P(lt, 2.4, 2.8)) : 1), o: p.o * (k === 4 && lt > 2.4 ? .35 : 1) });
        if (k === 3) { d.style.borderColor = lt > 2.4 ? 'var(--green)' : '#6B7080'; d.style.boxShadow = lt > 2.4 ? '0 0 34px rgba(124,255,178,.7)' : ''; d.style.background = lt > 2.4 ? 'var(--green)' : '#2A2D3A'; }
        labs[k].style.opacity = p.o * (k === 4 && lt > 2.4 ? .35 : 1);
        labs[k].style.color = k === 3 && lt > 2.4 ? 'var(--green)' : '';
      });
      T(boomL, { o: P(lt, .6, .8) * (lt > 2.4 ? .35 : 1), s: 1 + .1 * Math.sin(lt * 10) * (lt < 2.4 ? 1 : 0) });
      const op = pop(lt, 2.5, .4);
      T(okL, { s: op.s, o: op.o });
      T(rew, { o: lt > 1.3 && lt < 2.4 ? (Math.floor(lt * 6) % 2 ? 1 : .4) : 0 });
      const okp = P(lt, 2.8, 3.1);
      T(ok, { y: (1 - eo(okp)) * 30, o: okp });
      // red tint carried over from #09, washes out on rollback
      const red = .12 * (1 - P(lt, 1.3, 2.4));
      const green = .1 * Math.sin(P(lt, 2.4, 3.4) * Math.PI);
      flash.style.background = lt < 2.4 ? 'var(--red)' : 'var(--green)';
      flash.style.opacity = lt < 2.4 ? red : green;
      // VHS lines during rewind
      stage.style.filter = lt > 1.3 && lt < 2.4 ? `hue-rotate(${(rnd(Math.floor(lt * FPS)) - .5) * 30}deg) contrast(1.1)` : '';
    };
  },
});

// =====================================================================
// S13 · Wrap-up (68.4 – 74.4)
// =====================================================================
scene(68.4, 74.4, (root, cue, sub, dur) => {
  const chips = TERMS.map((s, k) => mk(root, `left:0;top:0;background:#1A1D27;border:3px solid ${k % 2 ? 'var(--green)' : 'var(--orange)'};font-size:34px`, esc(s), 'abs chip'));
  const l1 = mk(root, 'left:0;right:0;top:780px;text-align:center;font-size:84px;font-weight:900;color:var(--dim)', 'AI 负责写');
  const l2 = mk(root, 'left:0;right:0;top:900px;text-align:center;font-size:76px;font-weight:900', '你负责');
  const l3 = mk(root, 'left:0;right:0;top:1010px;text-align:center;font-size:96px;font-weight:900;color:var(--green);white-space:nowrap', '想清楚要什么');
  sub(.4, 2.6, '说到底');
  sub(3.0, 5.8, '还要判断它写得好不好');
  chips.forEach((_, k) => cue(.2 + k * .07, 'tick'));
  cue(1.4, 'pop'); cue(2.6, 'boom');
  return lt => {
    const out = 1 - P(lt, 5.7, 6);
    chips.forEach((c, k) => {
      const a = (k / chips.length) * Math.PI * 2 + lt * .18 - Math.PI / 2;
      const tx = 540 + Math.cos(a) * 440 - c.offsetWidth / 2, ty = 960 + Math.sin(a) * 560 - 30;
      const sx = 540 + (rnd(k * 9.1) - .5) * 2400, sy = 960 + (rnd(k * 4.3) - .5) * 3000;
      const f = eo(P(lt, .2 + k * .07, .9 + k * .07));
      T(c, { x: lerp(sx, tx, f), y: lerp(sy, ty, f), o: f * out * (lt > 2.6 ? .55 : 1), r: (1 - f) * 90 });
    });
    const p1 = pop(lt, 1.4, .45); T(l1, { s: p1.s, o: p1.o * out });
    const p2 = pop(lt, 2.4, .4); T(l2, { s: p2.s, o: p2.o * out });
    const p3 = pop(lt, 2.6, .55); T(l3, { s: p3.s, o: p3.o * out });
  };
});

// =====================================================================
// S14 · CTA (74.4 – 80)
// =====================================================================
scene(74.4, 80, (root, cue, sub, dur) => {
  const win = mk(root, 'left:60px;top:560px;width:960px;height:300px', '<div class="bar"><i></i><i></i><i></i></div>', 'abs win');
  const q = mk(win, 'left:36px;top:90px;width:890px;font-size:56px;font-weight:900;line-height:1.4');
  const s1 = mk(root, 'left:90px;top:930px;background:var(--green);color:#111;font-size:54px', '<span class="emo">⭐</span> 收藏 = 学会', 'abs chip');
  const s2 = mk(root, 'left:560px;top:930px;background:var(--orange);color:#111;font-size:54px', '<span class="emo">💬</span> 评论区点菜', 'abs chip');
  const ideas = ['经济学黑话', '职场黑话', '健身黑话', '设计黑话', '投资黑话', '医学黑话'];
  const bubs = ideas.map((s, k) => mk(root, `left:${[120, 600, 300, 680, 150, 520][k]}px;top:1300px;background:#1A1D27;border:2px solid var(--line);font-size:38px;color:var(--text)`, esc(s), 'abs chip'));
  sub(.3, 2.6, '收藏起来，下次看到不慌');
  sub(2.6, 5.2, '你还想听哪个领域？评论区告诉我');
  cue(.3, 'type', 1.6); cue(2.0, 'pop'); cue(2.4, 'pop');
  bubs.forEach((_, k) => cue(2.9 + k * .3, 'tick'));
  return lt => {
    const wp = pop(lt, 0, .4); T(win, { s: wp.s, o: wp.o });
    typeInto(q, '> 下期你想听哪个领域的黑话？', lt, .3, 9);
    const a = pop(lt, 2.0, .4); T(s1, { s: a.s, o: a.o, r: -4 });
    const b = pop(lt, 2.4, .4); T(s2, { s: b.s, o: b.o, r: 3 });
    bubs.forEach((e, k) => {
      const t0 = 2.9 + k * .3, f = P(lt, t0, t0 + 2.4);
      T(e, { y: -f * 260, o: lt < t0 ? 0 : clamp(Math.sin(f * Math.PI) * 2) });
    });
    // fade to black at the very end
    document.getElementById('flash').style.background = '#000';
    document.getElementById('flash').style.opacity = P(lt, 4.9, 5.6);
  };
});

// ---------- chrome & subs ----------
const segs = document.getElementById('segs');
const segFills = [...Array(10)].map(() => { const s = mk(segs, '', '<i></i>', 'seg'); return s.firstChild; });
const pill = document.getElementById('pill');
const chrome = document.getElementById('chrome');
const subEl = document.querySelector('#sub span');
const subWrap = document.getElementById('sub');

// grain (seeded noise texture, shifted every frame)
const gc = document.getElementById('grain'), gx = gc.getContext('2d');
const gimg = gx.createImageData(270, 480);
for (let i = 0; i < gimg.data.length; i += 4) { const v = rnd(i * .37) * 255; gimg.data[i] = gimg.data[i + 1] = gimg.data[i + 2] = v; gimg.data[i + 3] = 255; }
gx.putImageData(gimg, 0, 0);
gc.style.width = '1080px'; gc.style.height = '1920px'; gc.style.imageRendering = 'pixelated';

function seek(t) {
  curTime = t;
  const flash = document.getElementById('flash');
  flash.style.opacity = 0;
  stage.style.filter = '';
  for (const s of scenes) {
    const on = t >= s.start && t < s.end;
    s.root.style.display = on ? 'block' : 'none';
    if (on) s.update(t - s.start);
  }
  // chrome only on cards
  const ci = Math.floor((t - CARD0) / CARD_LEN);
  const inCards = t >= CARD0 && t < CARD0 + 10 * CARD_LEN;
  const cin = P(t, CARD0, CARD0 + .4) * (1 - P(t, CARD0 + 10 * CARD_LEN - .3, CARD0 + 10 * CARD_LEN));
  chrome.style.opacity = cin;
  if (inCards) {
    pill.textContent = `#${String(ci + 1).padStart(2, '0')} / 10`;
    segFills.forEach((f, k) => f.style.width = (k < ci ? 100 : k > ci ? 0 : P(t, CARD0 + ci * CARD_LEN, CARD0 + (ci + 1) * CARD_LEN) * 100) + '%');
  }
  // subtitles
  const s = SUBS.find(s => t >= s.s && t < s.e);
  if (s) {
    subEl.innerHTML = emo(esc(s.text));
    const k = P(t, s.s, s.s + .15), ko = P(t, s.e - .12, s.e);
    subWrap.style.opacity = k * (1 - ko);
    subWrap.style.transform = `translateY(${(1 - eo(k)) * 16}px)`;
  } else subWrap.style.opacity = 0;
  // grain jitter
  const f = Math.floor(t * FPS);
  gc.style.transform = `translate(${Math.floor(rnd(f) * 8 - 4)}px,${Math.floor(rnd(f + 99) * 8 - 4)}px)`;
}
window.seek = seek;
window.CUES = CUES.sort((a, b) => a.t - b.t);
window.SUBS = SUBS;
window.DUR = DUR; window.FPS = FPS;

// ---------- preview mode (real time playback, ?t=start) ----------
if (!navigator.webdriver) {
  const fit = () => { const k = Math.min(innerWidth / W, innerHeight / H); stage.style.transform = `scale(${k})`; };
  addEventListener('resize', fit); fit();
  const t0 = +(new URLSearchParams(location.search).get('t') || 0);
  const begin = performance.now();
  const loop = () => { seek((t0 + (performance.now() - begin) / 1000) % DUR); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
} else seek(0);
</script>
