<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>23 分钟 · 视频预览</title>
<style>
  :root {
    --bg: #05060a; --panel: #0c111c; --line: #1c2536; --ink: #e8f4ff; --dim: #7a8ba0;
    --cyan: #00f0ff; --magenta: #ff2e88;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.5 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; height: 100vh; }
  .stage { display: flex; align-items: center; justify-content: center; padding: 16px; min-height: 0; }
  #out { height: 100%; max-height: calc(100vh - 32px); max-width: 100%; aspect-ratio: 9 / 16;
    background: #000; box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.6); }
  aside { border-left: 1px solid var(--line); background: var(--panel); padding: 20px; overflow: auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--dim); margin: 0 0 18px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  button { background: #141c2b; color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--cyan); }
  button.primary { background: var(--cyan); color: #00161a; border-color: var(--cyan); font-weight: 700; }
  button:disabled { opacity: .45; cursor: wait; }
  input[type=range] { width: 100%; accent-color: var(--cyan); }
  .time { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--cyan); }
  .scenes { list-style: none; padding: 0; margin: 12px 0; }
  .scenes li { display: flex; justify-content: space-between; padding: 6px 8px; border-radius: 6px; cursor: pointer; color: var(--dim); }
  .scenes li:hover { background: #121a28; color: var(--ink); }
  .scenes li.on { background: #10202a; color: var(--cyan); }
  .scenes span:last-child { font-family: ui-monospace, Menlo, monospace; }
  pre { white-space: pre-wrap; background: #080c14; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; color: var(--dim); font-size: 12px; max-height: 220px; overflow: auto; }
  .hint { color: var(--dim); font-size: 12px; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font-size: 11px; }
  #status { color: var(--magenta); min-height: 1.5em; }
  body.render { display: block; background: #000; }
  body.render aside { display: none; }
  body.render .stage { padding: 0; }
  body.render #out { height: auto; max-height: none; width: auto; box-shadow: none; }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: 70vh auto; height: auto; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="stage"><canvas id="out" width="1080" height="1920"></canvas></div>
<aside>
  <h1>23 分钟 · 一次分心的真实代价</h1>
  <p class="sub">80 秒 · 1080×1920 · 60fps · 抖音竖屏</p>
  <div id="status">加载素材、合成音频中…</div>
  <div class="row">
    <button id="play" class="primary" disabled>▶ 播放</button>
    <span class="time" id="time">00.00 / 80.00</span>
  </div>
  <input id="seek" type="range" min="0" max="80" step="0.01" value="0">
  <ul class="scenes" id="scenes"></ul>
  <div class="row">
    <button id="rec" disabled>● 录制 WebM（实时）</button>
    <button id="wav" disabled>⬇ 音频 WAV</button>
    <button id="png" disabled>⬇ 当前帧 PNG</button>
  </div>
  <div class="row">
    <button id="safe">安全区：关</button>
    <button id="postBtn">后期：开</button>
  </div>
  <p class="hint"><kbd>空格</kbd> 播放/暂停　<kbd>←</kbd><kbd>→</kbd> ±1 秒　<kbd>,</kbd><kbd>.</kbd> ±1 帧　<kbd>S</kbd> 安全区</p>
  <p class="hint">高质量成片请用 <code>node render.mjs</code> 逐帧导出 MP4（不丢帧）。</p>
  <pre id="report"></pre>
</aside>

<script src="src/config.js"></script>
<script src="src/util.js"></script>
<script src="assets/photos/manifest.js"></script>
<script src="assets/fonts/fonts.js"></script>
<script src="src/assets.js"></script>
<script src="src/post.js"></script>
<script src="src/draw.js"></script>
<script src="src/scenes.js"></script>
<script src="src/audio.js"></script>
<script src="src/engine.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const renderMode = q.has('render');
  const scale = parseFloat(q.get('scale') || '1');
  if (renderMode) document.body.classList.add('render');

  const $ = (id) => document.getElementById(id);
  const out = $('out');
  const CFG = FX.CFG;

  // 先加载素材、出第一帧；音频在后台合成（无头渲染时由 render.mjs 按需请求音频）
  window.__FX_READY = FX.boot(out, { scale, audio: false }).then((r) => {
    if (renderMode) return r;
    initUI(r);
    return r;
  }).catch((e) => { $('status').textContent = '启动失败：' + e.message; console.error(e); throw e; });

  function initUI(r) {
    const note = r.webgl ? '' : '（当前浏览器不支持 WebGL2，已关闭后期效果）';
    $('status').textContent = '合成配乐中（约 10–30 秒）…' + note;
    $('report').textContent = ['字体', ...r.report.fonts, '', '照片', ...r.report.photos].join('\n');
    $('png').disabled = false;
    FX.Audio.render(48000).then((buf) => {
      FX.Player.init(buf);
      ['play', 'rec', 'wav'].forEach((id) => ($(id).disabled = false));
      $('status').textContent = note;
    });

    const list = $('scenes');
    CFG.SCENES.forEach((s) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${s.label}</span><span>${s.start.toFixed(0).padStart(2, '0')}s</span>`;
      li.onclick = () => FX.Player.seek(s.start + 0.001);
      li.dataset.id = s.id;
      list.appendChild(li);
    });

    const update = (t) => {
      $('time').textContent = `${t.toFixed(2).padStart(5, '0')} / ${CFG.DURATION.toFixed(2)}`;
      $('seek').value = t;
      const id = FX.sceneAt(t).id;
      list.querySelectorAll('li').forEach((li) => li.classList.toggle('on', li.dataset.id === id));
      $('play').textContent = FX.Player.playing ? '❚❚ 暂停' : '▶ 播放';
    };
    FX.Player.onTick(update);
    update(0);

    const toggle = () => (FX.Player.playing ? FX.Player.pause() : FX.Player.play(), update(FX.Player.t));
    $('play').onclick = toggle;
    $('seek').oninput = (e) => FX.Player.seek(parseFloat(e.target.value));
    $('safe').onclick = () => {
      FX.Engine.showSafe = !FX.Engine.showSafe;
      $('safe').textContent = '安全区：' + (FX.Engine.showSafe ? '开' : '关');
      FX.Player.seek(FX.Player.t);
    };
    $('postBtn').onclick = () => {
      FX.Engine.postOn = !FX.Engine.postOn;
      $('postBtn').textContent = '后期：' + (FX.Engine.postOn ? '开' : '关');
      FX.Player.seek(FX.Player.t);
    };
    const download = (blob, name) => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    };
    $('wav').onclick = () => download(new Blob([FX.Audio.toWav(FX.Player.audioBuf)], { type: 'audio/wav' }), 'focus-23min.wav');
    $('png').onclick = () => out.toBlob((b) => download(b, `frame-${FX.Player.t.toFixed(2)}s.png`), 'image/png');
    $('rec').onclick = async () => {
      $('rec').disabled = true;
      const blob = await FX.Player.recordWebM((p) => ($('status').textContent = `录制中 ${(p * 100).toFixed(0)}%（请保持此页在前台）`));
      $('status').textContent = '录制完成';
      $('rec').disabled = false;
      download(blob, 'focus-23min.webm');
    };
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
      const dt = 1 / CFG.FPS;
      if (e.key === ' ') { e.preventDefault(); toggle(); }
      else if (e.key === 'ArrowRight') FX.Player.seek(FX.Player.t + 1);
      else if (e.key === 'ArrowLeft') FX.Player.seek(FX.Player.t - 1);
      else if (e.key === '.') FX.Player.seek(FX.Player.t + dt);
      else if (e.key === ',') FX.Player.seek(FX.Player.t - dt);
      else if (e.key === 's' || e.key === 'S') $('safe').click();
    });
  }
})();
</script>
</body>
</html>
